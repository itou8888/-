<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無制限・可変コンテンツジェネレーター</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 20px;
            background-color: #f5f7fa;
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            max-width: 1350px;
            margin: 0 auto;
            gap: 30px;
        }
        @media (min-width: 900px) {
            .container {
                flex-direction: row;
                justify-content: space-around;
            }
        }

        /* 左側：入力フォーム */
        .editor-side {
            flex: 1.2;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        @media (min-width: 900px) {
            .editor-side {
                max-height: 85vh;
                overflow-y: auto;
            }
        }
        
        /* 操作パネル */
        .ctrl-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 6px;
        }
        .btn-ctrl {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            flex: 1;
            min-width: 140px;
            text-align: center;
        }
        .btn-add { background-color: #007bff; }
        .btn-add:hover { background-color: #0056b3; }
        .btn-remove { background-color: #6c757d; }
        .btn-remove:hover { background-color: #5a6268; }

        /* ★列数切り替えパネル */
        .layout-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #fff3cd;
            padding: 10px;
            border-radius: 6px;
            align-items: center;
        }
        .layout-selector label {
            font-size: 13px;
            font-weight: bold;
            margin: 0;
            color: #856404;
        }
        .btn-layout {
            padding: 6px 12px;
            font-size: 13px;
            border: 2px solid #ffc107;
            background: white;
            color: #856404;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-layout.active {
            background: #ffc107;
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .form-group {
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .form-group:focus-within {
            border-color: #007bff;
            background-color: #f0f7ff;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        
        /* フォントサイズ調整用のコントロール */
        .font-size-ctrl {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: #fff;
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .font-size-ctrl input[type="range"] {
            flex: 1;
        }
        .font-size-val {
            font-size: 13px;
            font-weight: bold;
            min-width: 45px;
        }

        .hint {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }
        textarea {
            width: 100%;
            height: 60px;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            resize: vertical;
        }
        
        /* 画像4枚用の入力グリッド */
        .sub-image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .sub-image-box {
            border: 1px dashed #aaa;
            padding: 8px;
            background: #fff;
            border-radius: 4px;
        }
        .sub-image-box:focus-within {
            border-color: #28a745;
            background-color: #f4fbf6;
        }

        /* 画像操作 */
        .image-ctrl {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 5px;
        }
        @media (min-width: 400px) {
            .image-ctrl {
                flex-direction: row;
                align-items: center;
                gap: 8px;
            }
        }
        input[type="file"] {
            width: 100%;
            font-size: 11px;
        }
        .btn-clear {
            padding: 4px 8px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
        }
        .btn-clear:hover {
            background-color: #bd2130;
        }

        /* 右側：出力エリア */
        .preview-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 画像化エリア本体 */
        #capture-area {
            width: 550px;
            max-width: 100%;
            background: white;
            border: 1px solid #ccc;
            box-sizing: border-box;
            display: grid;
        }

        /* マスのデザイン */
        .card {
            border: 1px solid #eee;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background: white;
            position: relative;
        }
        .card-number {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 20px;
            height: 20px;
            background-color: rgba(0,0,0,0.5);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }
        
        .card-text {
            font-size: 14px;
            font-weight: bold;
            margin-left: 20px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        
        /* 内部画像用の可変ミニグリッド */
        .multi-img-grid {
            display: grid;
            gap: 4px;
            width: 100%;
        }
        
        .has-images {
            margin-top: 10px;
        }

        /* 枚数ごとのグリッドルール */
        .img-count-1 { grid-template-columns: 1fr; }
        .img-count-2 { grid-template-columns: repeat(2, 1fr); }
        .img-count-3, .img-count-4 { grid-template-columns: repeat(2, 1fr); }

        .multi-img-box {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: transparent;
            width: 100%;
        }
        
        .img-count-1 .multi-img-box { min-height: 180px; }
        .img-count-2 .multi-img-box { min-height: 140px; }
        .img-count-3 .multi-img-box, .img-count-4 .multi-img-box { min-height: 120px; }

        .card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* ダウンロードボタン */
        .btn-download {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            max-width: 300px;
        }
        .btn-download:hover {
            background-color: #218838;
        }

        /* 免責事項の注記 */
        .notice {
            margin-top: 15px;
            font-size: 11px;
            color: #888;
            text-align: center;
            max-width: 500px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="editor-side">
        <h2 style="margin-top:0;">グリッド画像メーカー</h2>
        
        <div class="ctrl-panel">
            <button class="btn-ctrl btn-add" id="add-block-btn">➕ コンテンツを追加</button>
            <button class="btn-ctrl btn-remove" id="remove-block-btn">❌ 最後の数を減らす</button>
        </div>

        <div class="layout-selector">
            <label>全体の並び方：</label>
            <button class="btn-layout" id="layout-col1">縦1列 (縦分割)</button>
            <button class="btn-layout active" id="layout-auto">自動おまかせ</button>
        </div>
        
        <div class="form-grid" id="all-forms-container">
            </div>
    </div>

    <div class="preview-side">
        <h2>出力プレビュー</h2>
        
        <div id="capture-area">
            </div>

        <button class="btn-download" id="download-btn">画像をダウンロード</button>
        
        <div class="notice">
            ※ 本ツールを利用して生成された画像に関する著作権等のトラブルについて、管理者は一切の責任を負いません。私的利用の範囲内でご利用ください。
        </div>
    </div>
</div>

<script>
    const allFormsContainer = document.getElementById('all-forms-container');
    const captureArea = document.getElementById('capture-area');
    
    let currentBlockCount = 0;
    const imagesPerCard = 4;
    // ★レイアウトモード状態 ( 'auto' = 自動, 'col1' = 縦1列強制 )
    let currentLayoutMode = 'auto'; 

    function createNewBlock() {
        currentBlockCount++;
        const i = currentBlockCount;

        // 入力フォーム生成
        let subImagesHTML = '';
        for (let sub = 1; sub <= imagesPerCard; sub++) {
            subImagesHTML += `
                <div class="sub-image-box" id="sub-group-${i}-${sub}" tabindex="0">
                    <div class="hint">画像${sub}</div>
                    <div class="image-ctrl">
                        <input type="file" id="input-img-${i}-${sub}" accept="image/*">
                        <button class="btn-clear" id="clear-btn-${i}-${sub}">消す</button>
                    </div>
                </div>`;
        }

        const formGroupHTML = `
            <div class="form-group" id="form-group-${i}">
                <label>【${i}】番目のコンテンツ</label>
                <div class="font-size-ctrl">
                    <span class="hint">文字サイズ:</span>
                    <input type="range" id="input-font-size-${i}" min="10" max="40" value="14">
                    <span class="font-size-val" id="font-size-val-${i}">14px</span>
                </div>
                <textarea id="input-text-${i}" placeholder="文字を入力（任意）"></textarea>
                <div class="sub-image-grid">${subImagesHTML}</div>
            </div>`;
        allFormsContainer.insertAdjacentHTML('beforeend', formGroupHTML);

        // プレビューカード生成
        const cardHTML = `
            <div class="card" id="preview-card-${i}">
                <div class="card-number">${i}</div>
                <div id="preview-text-${i}" class="card-text"></div>
                <div class="multi-img-grid" id="img-grid-${i}"></div>
            </div>`;
        captureArea.insertAdjacentHTML('beforeend', cardHTML);

        // イベント登録
        const textInput = document.getElementById(`input-text-${i}`);
        const textPreview = document.getElementById(`preview-text-${i}`);
        const fontSizeInput = document.getElementById(`input-font-size-${i}`);
        const fontSizeVal = document.getElementById(`font-size-val-${i}`);

        textInput.addEventListener('input', () => { textPreview.textContent = textInput.value; });

        fontSizeInput.addEventListener('input', () => {
            const size = fontSizeInput.value;
            textPreview.style.fontSize = `${size}px`;
            fontSizeVal.textContent = `${size}px`;
        });

        let imageSources = [null, null, null, null];

        function refreshImages() {
            const gridElement = document.getElementById(`img-grid-${i}`);
            gridElement.innerHTML = ''; 

            const activeSrcs = imageSources.filter(src => src !== null);
            const count = activeSrcs.length;

            if (count === 0) {
                gridElement.className = "multi-img-grid";
                gridElement.classList.remove('has-images');
            } else {
                gridElement.className = `multi-img-grid img-count-${count} has-images`;

                activeSrcs.forEach(src => {
                    const box = document.createElement('div');
                    box.className = 'multi-img-box';
                    const img = document.createElement('img');
                    img.className = 'card-img';
                    img.src = src;
                    box.appendChild(img);
                    gridElement.appendChild(box);
                });
            }
        }

        for (let sub = 1; sub <= imagesPerCard; sub++) {
            const fileInput = document.getElementById(`input-img-${i}-${sub}`);
            const clearBtn = document.getElementById(`clear-btn-${i}-${sub}`);
            const subGroup = document.getElementById(`sub-group-${i}-${sub}`);

            function processFile(file) {
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageSources[sub - 1] = event.target.result;
                    refreshImages();
                };
                reader.readAsDataURL(file);
            }

            fileInput.addEventListener('change', (e) => { processFile(e.target.files[0]); });

            subGroup.addEventListener('paste', (e) => {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let j = 0; j < items.length; j++) {
                    if (items[j].type.indexOf('image') !== -1) {
                        processFile(items[j].getAsFile());
                        e.preventDefault();
                        break;
                    }
                }
            });

            clearBtn.addEventListener('click', () => {
                fileInput.value = '';
                imageSources[sub - 1] = null;
                refreshImages();
            });
        }

        updateLayout();
    }

    function removeLastBlock() {
        if (currentBlockCount <= 1) {
            alert("これ以上は減らせません");
            return;
        }
        document.getElementById(`form-group-${currentBlockCount}`).remove();
        document.getElementById(`preview-card-${currentBlockCount}`).remove();
        currentBlockCount--;
        updateLayout();
    }

    // ★並び方の配置計算をアップデート
    function updateLayout() {
        const count = currentBlockCount;
        
        // 「縦1列」モードが選ばれている場合は、コンテンツ数に関わらず常に縦1列にする
        if (currentLayoutMode === 'col1') {
            captureArea.style.gridTemplateColumns = "1fr";
            return;
        }

        // 以下は「自動おまかせ」モードの時のロジック
        if (count === 1 || count === 2) {
            captureArea.style.gridTemplateColumns = "1fr";
        } else if (count === 3 || count === 4) {
            captureArea.style.gridTemplateColumns = "repeat(2, 1fr)";
        } else {
            captureArea.style.gridTemplateColumns = "repeat(3, 1fr)";
        }
    }

    // ★レイアウト切り替えボタンのイベント登録
    const btnCol1 = document.getElementById('layout-col1');
    const btnAuto = document.getElementById('layout-auto');

    btnCol1.addEventListener('click', () => {
        currentLayoutMode = 'col1';
        btnCol1.classList.add('active');
        btnAuto.classList.remove('active');
        updateLayout();
    });

    btnAuto.addEventListener('click', () => {
        currentLayoutMode = 'auto';
        btnAuto.classList.add('active');
        btnCol1.classList.remove('active');
        updateLayout();
    });

    // 初期起動
    createNewBlock();
    createNewBlock();

    document.getElementById('add-block-btn').addEventListener('click', createNewBlock);
    document.getElementById('remove-block-btn').addEventListener('click', removeLastBlock);

    // ダウンロード処理
    document.getElementById('download-btn').addEventListener('click', () => {
        const numbers = document.querySelectorAll('.card-number');
        numbers.forEach(el => el.style.opacity = '0');
        
        html2canvas(captureArea, { 
            useCORS: true,
            scale: 2,
            backgroundColor: '#ffffff'
        }).then(canvas => {
            numbers.forEach(el => el.style.opacity = '1');
            const link = document.createElement('a');
            link.download = `grid-image-${currentBlockCount}split.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    });
</script>

</body>
</html>
